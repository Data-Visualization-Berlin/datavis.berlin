title = "Data visualisation Berlin"
invisibleSections = ["jobs"]

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "An open list to the data visualisation scene in Berlin. All people, things and places that are related to visualisation, infographic, data art, data journalism, research, and data tools are welcome!"
  keywords = "data visualisation visualisation design infographic information graphic data-driven journalism ddj interface design"
  author = "Jonas Parnow"
  twitter = "zeto"
  telegram = "visber"
  source = "https://github.com/Data-Visualization-Berlin/Datavis-Berlin-Website"
  imprint = "https://jonasparnow.com/imprint"
  privacy = "https://jonasparnow.com/privacy"
  direction = "ltr"

[languages]
  [languages.en]
    baseURL = "https://datavis.berlin"
    LanguageName = "English"
    languageCode = "en"
    weight = 1
    disableKinds = ["taxonomy", "section"]
  [languages.de]
    title = "Daten Visualisierung Berlin"
    baseURL = "https://de.datavis.berlin"
    description = "Eine offene List der Datenvisualisierungsszene in Berlin. Alle Menschen, Dinge und Orte, die mit Visualisierung, Infografik, Datenkunst, Datenjournalismus, Forschung und Datenanwendungen verwandt sind, sind willkommen!"
    keywords = "Visualisierung Daten Infografik Design Informationsgrafik Datenjournalismus DDJ Statistik Interfacedesign"
    LanguageName = "Deutsch"
    languageCode = "de"
    weight = 2
    disableKinds = ["taxonomy", "section"]
